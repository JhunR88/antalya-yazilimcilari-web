<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgMentor" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#1f2438"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgMentor)"/>
  <!-- İki Profil Arasında Bağlantı (Eşleşme) -->
  <line x1="300" y1="180" x2="500" y2="180" stroke="#06b6d4" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="400" cy="180" r="26" fill="#06b6d4"/>
  <path d="M393 180L407 180M400 173L407 180L400 187" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mentör Kartı -->
  <circle cx="270" cy="180" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="270" y="175" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">&lt;/&gt;</text>
  <text x="270" y="195" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Senior</text>
  <!-- Menti Kartı -->
  <circle cx="530" cy="180" r="45" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
  <text x="530" y="175" text-anchor="middle" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">{..}</text>
  <text x="530" y="195" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Junior</text>
  <text x="400" y="340" text-anchor="middle" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Kod Antalya: Mentorluk Eşleşmesi</text>
  <text x="400" y="370" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Yazılımcılar ve Genç Yetenekler İçin Eşleşme Platformu</text>
</svg>
