<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6"/>

  <circle cx="400" cy="225" r="140" fill="#06b6d4" opacity="0.06"/>
  <circle cx="400" cy="225" r="90" fill="#3b82f6" opacity="0.08"/>

  <!-- Kod Penceresi Taslağı -->
  <rect x="250" y="115" width="300" height="220" rx="12" fill="#131c31" stroke="#2a3b5c" stroke-width="1.5"/>
  <circle cx="275" cy="135" r="5" fill="#f43f5e"/>
  <circle cx="292" cy="135" r="5" fill="#eab308"/>
  <circle cx="309" cy="135" r="5" fill="#10b981"/>
  <line x1="250" y1="155" x2="550" y2="155" stroke="#1e293b" stroke-width="1"/>

  <!-- Kod Satırları -->
  <rect x="275" y="180" width="120" height="8" rx="4" fill="#06b6d4" opacity="0.8"/>
  <rect x="275" y="200" width="180" height="8" rx="4" fill="#38bdf8" opacity="0.6"/>
  <rect x="295" y="220" width="140" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
  <rect x="295" y="240" width="100" height="8" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="275" y="260" width="60" height="8" rx="4" fill="#a855f7" opacity="0.7"/>

  <!-- Vurgu Simgesi -->
  <g transform="translate(450, 220)">
    <circle cx="35" cy="35" r="32" fill="url(#accentGrad)"/>
    <path d="M26 35L20 41L26 47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 35L50 41L44 47" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 31L32 51" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="400" y="380" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="0.05em">
    ANTALYA YAZILIMCILARI PROJESİ
  </text>
</svg>
